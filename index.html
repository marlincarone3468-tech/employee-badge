<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a6a5f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="职工电子工牌" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>职工电子工牌</title>
  <style>
    :root {
      --bg: #1a6a5f;
      --bg-deep: #15574e;
      --tab: #3d9a88;
      --qr-green: #5aaf68;
      --label-green: #43a047;
      --card: #ffffff;
      --text: #111;
      --nav: #6a6a6a;
      --nav-active: #2a7a6c;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background: #0d3d37;
      color: var(--text);
    }

    .phone {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      min-height: 100%;
      min-height: 100dvh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* ========== Header ========== */
    .header {
      flex-shrink: 0;
      background: var(--bg);
      padding: calc(8px + var(--safe-top)) 10px 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .branding {
      width: 100%;
      max-width: 400px;
      height: auto;
      display: block;
      object-fit: contain;
      /* blend extracted green strip into page bg */
      mix-blend-mode: normal;
    }

    /* ========== Main / Card ========== */
    .main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 2px 10px 6px;
    }

    .card {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: transparent;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      filter: drop-shadow(0 4px 14px rgba(0,0,0,.18));
    }

    /* 页签：全宽青绿顶条 + 底边中间梯形下凸、两侧圆肩 */
    .card-tab {
      flex-shrink: 0;
      position: relative;
      z-index: 2;
      height: 52px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 3px;
      background: transparent;
      padding: 0;
      margin: 0;
    }

    .card-tab-shape {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    .card-tab .tab-text {
      position: relative;
      z-index: 1;
      line-height: 1;
      margin-top: 12px;
    }

    .card-body {
      flex: 1;
      min-height: 0;
      margin-top: -28px;
      padding-top: 28px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.78) 0%, rgba(255,255,255,.70) 50%, rgba(255,255,255,.82) 100%),
        url("card_watermark.jpg") center top / cover no-repeat,
        #f6faf8;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border-radius: 0 0 16px 16px;
    }

    .profile {
      display: flex;
      gap: 12px;
      padding: 14px 16px 4px;
      align-items: flex-start;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }

    .avatar-placeholder {
      width: 78px;
      height: 92px;
      border-radius: 6px;
      background: #c5c5c5;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    .avatar-placeholder::before {
      content: "";
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #9a9a9a;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
    }

    .avatar-placeholder::after {
      content: "";
      position: absolute;
      width: 64px;
      height: 42px;
      border-radius: 32px 32px 0 0;
      background: #aeaeae;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
    }

    .info {
      flex: 1;
      min-width: 0;
      padding-top: 0;
    }

    .info .name {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 6px;
      word-break: break-all;
    }

    .info .row {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.5;
      color: #222;
    }

    .qr-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2px 10px 0;
    }

    .qr-wrap img {
      width: min(72vw, 300px);
      max-width: 78%;
      max-height: 44vh;
      height: auto;
      aspect-ratio: 1;
      object-fit: contain;
      display: block;
      image-rendering: pixelated;
      background: #fff;
      padding: 4px;
      border-radius: 2px;
    }

    .green-label {
      margin-top: 6px;
      color: #4caf50;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 3px;
      line-height: 1.2;
    }

    /* Ticket perforation */
    .ticket {
      flex-shrink: 0;
      position: relative;
      margin: 4px 0 0;
      padding: 0 0 12px;
      background: #fff;
    }

    .ticket::before,
    .ticket::after {
      content: "";
      position: absolute;
      top: -1px;
      width: 18px;
      height: 18px;
      background: var(--bg);
      border-radius: 50%;
      z-index: 5;
    }

    .ticket::before { left: -9px; }
    .ticket::after { right: -9px; }

    .ticket-line {
      margin: 0 18px;
      border: none;
      border-top: 1.5px dashed #cfcfcf;
    }

    .clock {
      text-align: center;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 10px 10px 12px;
      font-variant-numeric: tabular-nums;
      font-family: "DIN Alternate", "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111;
    }

    .status-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 14px 14px;
    }

    .box-left {
      height: 68px;
      border-radius: 6px;
      background: linear-gradient(115deg, #4a9fd4 0%, #5ec0b4 48%, #7ed4a6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .box-right {
      height: 68px;
      border-radius: 6px;
      background: #eef0ef;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .vaccine-pill {
      display: inline-block;
      background: #4caf50;
      color: #fff;
      font-size: 12px;
      padding: 2px 12px;
      border-radius: 999px;
      font-weight: 600;
      line-height: 1.35;
    }

    .box-right .nodata {
      font-size: 16px;
      font-weight: 700;
      color: #222;
    }

    /* ========== Nav ========== */
    .nav {
      flex-shrink: 0;
      background: #fff;
      border-top: 1px solid #e5e5e5;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 5px 0 calc(5px + var(--safe-bottom));
      z-index: 10;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      color: var(--nav);
      font-size: 10px;
      background: none;
      border: none;
      cursor: default;
      position: relative;
    }

    .nav-item.active { color: var(--nav-active); }

    .nav-item svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .nav-item .dot {
      position: absolute;
      top: 0;
      right: calc(50% - 13px);
      width: 6px;
      height: 6px;
      background: #e53935;
      border-radius: 50%;
    }

    /* Edit */
    .edit-btn {
      position: absolute;
      right: 14px;
      bottom: calc(58px + var(--safe-bottom));
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(26, 106, 95, 0.92);
      color: #fff;
      box-shadow: 0 3px 12px rgba(0,0,0,.25);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      cursor: pointer;
    }

    .edit-btn svg { width: 20px; height: 20px; fill: currentColor; }

    /* Modal */
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-mask.show { display: flex; }

    .modal {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 16px 16px 0 0;
      padding: 16px 18px calc(18px + var(--safe-bottom));
      animation: slideUp .25s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(40%); opacity: .6; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal h2 { font-size: 17px; margin-bottom: 14px; text-align: center; }

    .field { margin-bottom: 12px; }

    .field label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 4px;
    }

    .field input {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 11px 12px;
      font-size: 16px;
      outline: none;
      background: #fafafa;
    }

    .field input:focus {
      border-color: var(--tab);
      background: #fff;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .modal-actions button {
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-cancel { background: #f0f0f0; color: #333; }
    .btn-save { background: var(--bg); color: #fff; }

    @media (min-width: 500px) {
      body { background: #0d3d37; padding: 16px 0; }
      .phone {
        min-height: calc(100vh - 32px);
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 12px 40px rgba(0,0,0,.4);
      }
      .modal-mask { align-items: center; }
      .modal { border-radius: 16px; margin: 16px; }
    }

    /* Short screens */
    @media (max-height: 720px) {
      .branding { max-width: 340px; }
      .header { padding-bottom: 0; }
      .qr-wrap img { width: min(66vw, 260px); max-height: 36vh; }
      .info .name { font-size: 22px; }
      .clock { font-size: 26px; padding-top: 6px; padding-bottom: 8px; }
      .box-left, .box-right { height: 58px; }
      .box-left { font-size: 16px; }
      .box-right .nodata { font-size: 15px; }
      .avatar-placeholder { width: 68px; height: 80px; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <header class="header">
      <img class="branding" src="branding_block.png" alt="郑州大学第一附属医院" />
    </header>

    <main class="main">
      <section class="card">
        <div class="card-tab">
          <svg class="card-tab-shape" viewBox="0 0 400 56" preserveAspectRatio="none" aria-hidden="true">
            <defs>
              <linearGradient id="tabGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#3f9d8b"/>
                <stop offset="100%" stop-color="#368f80"/>
              </linearGradient>
            </defs>
            <!--
              按正确截图底边采样：
              两侧底边约 y=30，中间下凸平底约 y=48，
              过渡约在 22%~28% 与 72%~78% 宽度，圆滑肩部。
            -->
            <path fill="url(#tabGrad)" d="
              M 0 16
              Q 0 0 16 0
              L 384 0
              Q 400 0 400 16
              L 400 30
              L 312 30
              C 300 30 292 48 280 48
              L 120 48
              C 108 48 100 30 88 30
              L 0 30
              Z
            "/>
          </svg>
          <span class="tab-text">职工电子工牌</span>
        </div>
        <div class="card-body">
          <div class="profile">
            <div class="avatar-placeholder" aria-hidden="true"></div>
            <div class="info">
              <div class="name" id="dispName">孙章耀</div>
              <div class="row">科室: <span id="dispDept">急诊外科 (2)</span></div>
              <div class="row">职称: <span id="dispTitle">护士</span></div>
              <div class="row">工号: <span id="dispId">242327</span></div>
            </div>
          </div>

          <div class="qr-wrap">
            <img src="qr_code.png" alt="绿码二维码" />
            <div class="green-label">绿码</div>
          </div>

          <div class="ticket">
            <hr class="ticket-line" />
            <div class="clock" id="clock">-- -- --:--:--</div>
            <div class="status-row">
              <div class="box-left">暂无数据</div>
              <div class="box-right">
                <span class="vaccine-pill">新冠疫苗</span>
                <span class="nodata">暂无数据</span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <nav class="nav" aria-label="底部导航">
      <button class="nav-item" type="button">
        <span class="dot"></span>
        <svg viewBox="0 0 24 24"><path d="M12 3.2 3 11h2.5v8.5h5V14h3v5.5h5V11H21L12 3.2z"/></svg>
        <span>首页</span>
      </button>
      <button class="nav-item" type="button">
        <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"/></svg>
        <span>工作</span>
      </button>
      <button class="nav-item active" type="button">
        <svg viewBox="0 0 24 24"><path d="M7 3h10a2 2 0 0 1 2 2v14l-7-3-7 3V5a2 2 0 0 1 2-2zm2 4v2h6V7H9zm0 4v2h6v-2H9z"/></svg>
        <span>电子工牌</span>
      </button>
      <button class="nav-item" type="button">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        <span>联系人</span>
      </button>
      <button class="nav-item" type="button">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/></svg>
        <span>我的</span>
      </button>
    </nav>

    <button class="edit-btn" id="editBtn" type="button" aria-label="编辑工牌信息" title="编辑信息">
      <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    </button>
  </div>

  <div class="modal-mask" id="modalMask">
    <div class="modal" role="dialog" aria-labelledby="modalTitle">
      <h2 id="modalTitle">编辑工牌信息</h2>
      <div class="field">
        <label for="inputName">姓名</label>
        <input id="inputName" type="text" maxlength="20" autocomplete="name" />
      </div>
      <div class="field">
        <label for="inputDept">科室</label>
        <input id="inputDept" type="text" maxlength="40" />
      </div>
      <div class="field">
        <label for="inputTitle">职称</label>
        <input id="inputTitle" type="text" maxlength="30" />
      </div>
      <div class="field">
        <label for="inputId">工号</label>
        <input id="inputId" type="text" maxlength="20" inputmode="numeric" />
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" type="button" id="btnCancel">取消</button>
        <button class="btn-save" type="button" id="btnSave">保存</button>
      </div>
    </div>
  </div>

  <script>
    const KEY = "zzu_employee_badge_v1";
    const defaults = {
      name: "孙章耀",
      dept: "急诊外科 (2)",
      title: "护士",
      id: "242327"
    };

    const els = {
      name: document.getElementById("dispName"),
      dept: document.getElementById("dispDept"),
      title: document.getElementById("dispTitle"),
      id: document.getElementById("dispId"),
      clock: document.getElementById("clock"),
      mask: document.getElementById("modalMask"),
      inputName: document.getElementById("inputName"),
      inputDept: document.getElementById("inputDept"),
      inputTitle: document.getElementById("inputTitle"),
      inputId: document.getElementById("inputId")
    };

    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return { ...defaults };
        return { ...defaults, ...JSON.parse(raw) };
      } catch {
        return { ...defaults };
      }
    }

    function save(data) {
      localStorage.setItem(KEY, JSON.stringify(data));
    }

    function render(data) {
      els.name.textContent = data.name || " ";
      els.dept.textContent = data.dept || " ";
      els.title.textContent = data.title || " ";
      els.id.textContent = data.id || " ";
    }

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function tick() {
      const now = new Date();
      els.clock.textContent =
        pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + " " +
        pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
    }

    function openModal() {
      const data = load();
      els.inputName.value = data.name;
      els.inputDept.value = data.dept;
      els.inputTitle.value = data.title;
      els.inputId.value = data.id;
      els.mask.classList.add("show");
      setTimeout(() => els.inputName.focus(), 50);
    }

    function closeModal() {
      els.mask.classList.remove("show");
    }

    let state = load();
    render(state);
    tick();
    setInterval(tick, 1000);

    document.getElementById("editBtn").addEventListener("click", openModal);
    document.getElementById("btnCancel").addEventListener("click", closeModal);
    document.getElementById("btnSave").addEventListener("click", () => {
      state = {
        name: els.inputName.value.trim() || defaults.name,
        dept: els.inputDept.value.trim() || defaults.dept,
        title: els.inputTitle.value.trim() || defaults.title,
        id: els.inputId.value.trim() || defaults.id
      };
      save(state);
      render(state);
      closeModal();
    });

    els.mask.addEventListener("click", (e) => {
      if (e.target === els.mask) closeModal();
    });

    document.querySelector(".profile").addEventListener("click", openModal);

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
